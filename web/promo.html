<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<title>ORBITAL Promo</title>
<!--
  A ~27 second vertical (9:16) ad for the power-ups update, played by the real game.
  Open it full screen on a phone, start a screen recording, then tap PLAY.
  The game runs with ?promo, so it uses its own save data and never posts scores.
-->
<style>
:root{--a:#22f3ff;--b:#ff2d95;--g:#fff36b;--bg:#05010f;--font:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:#fff}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh * 9 / 16));height:min(100vh,calc(100vw * 16 / 9));overflow:hidden;background:var(--bg);container-type:size}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:none}

/* captions sit in TikTok's safe zone: below the top bar, clear of the right-hand buttons and bottom caption */
#cap{position:absolute;left:6cqw;right:16cqw;top:13cqh;display:flex;flex-direction:column;align-items:flex-start;gap:1.2cqh}
#cap .ln{display:inline-block;font-weight:900;font-size:7.4cqw;line-height:1.08;letter-spacing:.01em;padding:.9cqh 3cqw 1.1cqh;border-radius:2.4cqw;background:#fff;color:#0a0414;box-shadow:0 .6cqh 2.4cqh rgba(0,0,0,.45);transform-origin:left center;animation:capIn .38s cubic-bezier(.2,1.6,.4,1) both}
#cap .ln.hl{background:linear-gradient(90deg,var(--a),var(--b));color:#0a0414}
#cap .ln.gold{background:var(--g)}
#cap .ln:nth-child(2){animation-delay:.12s}
#cap.out .ln{animation:capOut .22s ease-in both}
@keyframes capIn{0%{opacity:0;transform:scale(.4) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes capOut{to{opacity:0;transform:translateY(-2cqh) scale(.9)}}

#dust{position:absolute;right:16cqw;top:5.5cqh;display:flex;align-items:center;gap:1.6cqw;padding:1cqh 3.4cqw;border-radius:999px;background:rgba(0,0,0,.55);border:.35cqw solid var(--g);box-shadow:0 0 2.6cqh rgba(255,243,107,.45);font-weight:900;font-size:4.6cqw;color:var(--g);opacity:0;transform:translateY(-2cqh);transition:opacity .3s,transform .3s}
#dust.show{opacity:1;transform:none}
#dust.bump{animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.18)}}

.tap{position:absolute;width:11cqw;height:11cqw;margin:-5.5cqw 0 0 -5.5cqw;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 2.5cqh var(--a),0 0 .8cqh #fff;animation:tap .6s ease-out forwards}
.tap::after{content:'';position:absolute;inset:-1cqw;border-radius:50%;border:.5cqw solid #fff;animation:ring .6s ease-out forwards}
@keyframes tap{0%{transform:scale(1.5);opacity:0}25%{transform:scale(.8);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}

#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqh;padding:0 8cqw 12cqh;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(23,5,64,.92),rgba(5,1,15,.97) 70%);opacity:0;transition:opacity .5s}
#end.show{opacity:1}
#end .logo{font-weight:900;font-size:17cqw;letter-spacing:.04em;background:linear-gradient(180deg,#fff 10%,var(--a) 55%,var(--b) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 2cqh var(--a))}
#end .big{font-weight:900;font-size:7cqw;letter-spacing:.06em}
#end .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4cqw;font-size:8cqw}
#end .cta{margin-top:1cqh;font-weight:900;font-size:5.6cqw;letter-spacing:.1em;padding:1.8cqh 7cqw;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b));color:#0a0414;box-shadow:0 0 3cqh rgba(34,243,255,.6);animation:pulse 1.1s ease-in-out infinite}
#end .url{font-weight:800;font-size:3.6cqw;opacity:.75;letter-spacing:.02em}
#end.show > *{animation:capIn .5s cubic-bezier(.2,1.6,.4,1) both}
#end.show > :nth-child(2){animation-delay:.15s}#end.show > :nth-child(3){animation-delay:.3s}
#end.show > :nth-child(4){animation:capIn .5s cubic-bezier(.2,1.6,.4,1) .45s both,pulse 1.1s ease-in-out 1s infinite}
#end.show > :nth-child(5){animation-delay:.6s}
@keyframes pulse{50%{transform:scale(1.06)}}

#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;background:var(--bg);cursor:pointer;pointer-events:auto;text-align:center;padding:8cqw}
#start b{font-size:9cqw;font-weight:900;letter-spacing:.1em;padding:2cqh 9cqw;border-radius:999px;border:.5cqw solid var(--a);box-shadow:0 0 3cqh var(--a);text-shadow:0 0 2cqh var(--a)}
#start span{font-size:3.6cqw;font-weight:700;opacity:.6;line-height:1.5}
#start.wait b{opacity:.4}
</style>
</head>
<body>
<div id="stage">
  <iframe id="game" title="ORBITAL"></iframe>
  <div class="ov" id="taps"></div>
  <div id="dust">✦ <span id="dustN">0</span></div>
  <div id="cap"></div>
  <div id="end">
    <div class="logo">ORBITAL</div>
    <div class="big">POWER-UPS ARE LIVE</div>
    <div class="chips">🛡️ 🐢 🔥 💫 ✦</div>
    <div class="cta">PLAY FREE</div>
    <div class="url">Link in bio · plays in any browser</div>
  </div>
  <div id="start" class="wait"><b>▶ PLAY</b><span>Start your screen recording,<br>then tap to play the ad</span></div>
</div>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const frame = $('#game'), stage = $('#stage');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let G, O, D;   // the game's window, window.__orbital, and document

  function caption(lines) {
    const c = $('#cap');
    c.classList.remove('out');
    c.innerHTML = lines.map(([t, k]) => `<span class="ln ${k || ''}">${t}</span>`).join('');
  }
  async function clearCaption() { $('#cap').classList.add('out'); await sleep(220); $('#cap').innerHTML = ''; }

  // show a finger tap on an element inside the game, then click it
  async function tap(sel, delay = 260) {
    const el = D.querySelector(sel);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const t = document.createElement('div');
    t.className = 'tap';
    t.style.left = (r.left + r.width / 2) + 'px'; t.style.top = (r.top + r.height / 2) + 'px';
    $('#taps').appendChild(t);
    setTimeout(() => t.remove(), 700);
    await sleep(delay);
    el.click();
  }

  // a decent autopilot: move to the nearest free orbit before each spike column
  let pilot = null;
  function autopilot(on) {
    clearInterval(pilot); pilot = null;
    if (!on) return;
    pilot = setInterval(() => {
      const S = O.S; if (S.mode !== 'playing') return;
      const spikes = S.items.filter(it => it.type === 'spike' && !it.fade && it.a > S.theta - 0.26).sort((a, b) => a.a - b.a);
      if (!spikes.length) return;
      const a0 = spikes[0].a;
      if (a0 - S.theta < 0.17) return;
      const blocked = new Set(spikes.filter(s => Math.abs(s.a - a0) < 0.02).map(s => s.ring));
      let best = -1;
      for (let k = 0; k < S.rings; k++) if (!blocked.has(k) && (best < 0 || Math.abs(k - S.ring) < Math.abs(best - S.ring))) best = k;
      if (best >= 0 && best !== S.ring && Math.abs(S.rPos - S.ring) < 0.3) O.switchRing(Math.sign(best - S.ring));
    }, 25);
  }

  // put a spike right in front of the comet so the next power-up visibly saves it
  function incoming() {
    const S = O.S;
    S.safeT = -9;
    let it = S.items.find(i => i.type === 'spike' && !i.fade && i.a > S.theta + 0.05);
    if (!it) return;
    it.a = S.theta + 0.12; it.ring = S.ring; delete it.from; it.passed = false;
  }

  let dustShown = 0, dustTimer = null;
  function trackDust(base) {
    clearInterval(dustTimer);
    dustTimer = setInterval(() => {
      const n = base + Math.floor(O.S.score / 5);
      if (n !== dustShown) { dustShown = n; $('#dustN').textContent = n; const d = $('#dust'); d.classList.remove('bump'); void d.offsetWidth; d.classList.add('bump'); }
    }, 60);
  }

  async function play() {
    // 1. hook
    O.start(); autopilot(true);
    caption([['THIS GAME JUST GOT'], ['POWER-UPS ⚡', 'hl']]);
    await sleep(2600);

    // 2. earn stardust
    await clearCaption();
    caption([['EVERY RUN EARNS'], ['✦ STARDUST', 'gold']]);
    dustShown = -1; trackDust(340); $('#dust').classList.add('show');
    await sleep(3600);

    // 3. crash, cash in, and open the power-ups screen
    autopilot(false); incoming();
    await sleep(1900);
    clearInterval(dustTimer);
    await clearCaption();
    caption([['SPEND IT BEFORE'], ['EVERY RUN 👇', 'hl']]);
    await sleep(1300);
    await tap('#again');
    $('#dust').classList.remove('show');
    await sleep(700);

    // 4. pick power-ups
    await tap('#luList [data-id="shield"]');
    await sleep(650);
    await clearCaption();
    caption([['PICK WHEN SLOW-MO'], ['KICKS IN 🐢', 'hl']]);
    await tap('#luList [data-id="slow"]');
    await sleep(600);
    await tap('#luList [data-lv="1"]', 200);
    await sleep(420);
    await tap('#luList [data-lv="1"]', 200);
    await sleep(800);
    await clearCaption();
    caption([['STACK THEM UP 🔥']]);
    await tap('#luList [data-id="revive"]');
    await sleep(900);
    await tap('#luGo');
    await sleep(300);

    // 5. power-ups in action
    autopilot(true);
    await clearCaption();
    caption([['🛡️ SHIELD'], ['TAKES A HIT', 'hl']]);
    await sleep(1300);
    autopilot(false); incoming(); await sleep(900); autopilot(true);
    await sleep(900);
    await clearCaption();
    caption([['💫 SECOND CHANCE'], ['CLEARS THE WAY', 'gold']]);
    await sleep(900);
    autopilot(false); incoming(); await sleep(900); autopilot(true);
    O.S.level = 2; O.S.passed = 35; O.S.lastPassA = -99;     // the next spike column takes you to level 3
    await sleep(600);
    for (let i = 0; i < 60 && O.S.level < 3; i++) await sleep(50);
    await clearCaption();
    caption([['🐢 SLOW-MO'], ['WHEN YOU WANT IT', 'hl']]);
    await sleep(3200);

    // 6. end card
    autopilot(false);
    await clearCaption();
    $('#end').classList.add('show');
    window.__promoDone = true;
  }

  // The game reads its save when it loads, so set up the promo save first. Add ?sound for game audio.
  try {
    for (const k of Object.keys(localStorage)) if (k.startsWith('orbitalpromo.')) localStorage.removeItem(k);
    const save = { dust: 340, runs: 20, swipeTut: 2, lastPicks: [], slowAt: 1, best: 0, muted: !new URLSearchParams(location.search).has('sound') };
    for (const k in save) localStorage.setItem('orbitalpromo.' + k, JSON.stringify(save[k]));
  } catch (e) {}
  frame.src = 'index.html?promo';

  frame.addEventListener('load', async () => {
    G = frame.contentWindow; D = G.document;
    while (D.getElementById('boot')) await sleep(100);
    O = G.__orbital;
    // hide the game's own chrome
    const css = D.createElement('style');
    // and push the game's menus below the captions
    css.textContent = '#mute,.legal,#loadout .go,#luHint,#luBack,#over .go{display:none!important}' +
      '#loadout,#over{justify-content:flex-start!important;padding-top:27vh!important}#over{padding-top:33vh!important}#loadout{gap:10px!important}';
    D.head.appendChild(css);
    $('#start').classList.remove('wait');
    window.__promoReady = true;
  });
  let running = false;
  $('#start').addEventListener('click', () => {
    if (running || !O) return;
    running = true;
    $('#start').remove();
    play();
  });
})();
</script>
</body>
</html>
