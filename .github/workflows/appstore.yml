name: Upload to App Store Connect

# Manual only: Actions tab → "Upload to App Store Connect" → Run workflow.
# Needs the Apple secrets/variables (see your private App Store guide).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version shown on the App Store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  upload:
    # Locked: only the repository owner, on this repository, can run an upload.
    # (Running a workflow already requires write access; forks never get these secrets.)
    if: github.repository == 'dummiesbuild26/Testcc' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SERVER_URL: ${{ vars.ORBITAL_SERVER_URL || 'https://orbital-server.dummiesbuild26.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=0
          for v in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::ASC_KEY_P8 secret is not set"; missing=1; fi
          if grep -q REPLACE_WITH_CONTACT_EMAIL web/privacy.html web/support.html; then
            echo "::error::Put your contact email in web/privacy.html and web/support.html first (Apple rejects placeholder contact info)"; missing=1
          fi
          exit $missing

      - name: Use the latest stable Xcode (Apple requires a current SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Point the app at the multiplayer server
        run: echo "window.ORBITAL_SERVER = '$SERVER_URL';" > web/config.js

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick a build number (must always increase)
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        run: |
          mkdir -p private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > private_keys/AuthKey.p8

      - name: Archive (automatic signing via API key)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Orbital.xcodeproj \
            -scheme Orbital \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Orbital.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Orbital.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### ✅ Build ${{ inputs.version }} ($BUILD_NUMBER) uploaded. It appears in App Store Connect → TestFlight after processing (~10-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf private_keys
