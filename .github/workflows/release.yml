name: Deploy server & build iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploys the multiplayer server + web game to Cloudflare Workers (free plan).
  # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
  server:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
      - name: Resolve server URL
        id: url
        run: |
          URL="${{ vars.ORBITAL_SERVER_URL }}"
          if [ -f server/deploy.log ]; then
            URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' server/deploy.log | head -1)
          fi
          echo "Server URL: ${URL:-<none, single-player only>}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            echo "### 🌐 Play online: $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: server
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Point the app at the multiplayer server
        if: needs.server.outputs.url != ''
        run: echo "window.ORBITAL_SERVER = '${{ needs.server.outputs.url }}';" > web/config.js

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Orbital.xcodeproj \
            -scheme Orbital \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Orbital.app
          test -f "$APP/web/index.html"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Orbital.ipa Payload
          ls -lh Orbital.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-ipa
          path: Orbital.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ORBITAL ${{ steps.ver.outputs.tag }}
          make_latest: true
          files: Orbital.ipa
          body: |
            🪐 **ORBITAL** — one tap, two orbits, zero mercy.

            ${{ needs.server.outputs.url && format('🌐 **Play in any browser / invite friends:** {0}', needs.server.outputs.url) || '' }}

            **Install the IPA** (unsigned — your sideloading tool signs it with your Apple ID):
            - [Sideloadly](https://sideloadly.io) or [AltStore](https://altstore.io): drag in `Orbital.ipa`
            - TrollStore: open `Orbital.ipa` directly

            Built from ${{ github.sha }}.
